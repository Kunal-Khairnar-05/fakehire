# Continuous Integration: runs on every push to main and on every pull request.
# Each "job" runs on a fresh Ubuntu machine provided by GitHub. Jobs run in PARALLEL
# unless one "needs" another.
#
#   lint     ─┐
#   ml       ─┤
#   api      ─┼──► docker (only if all four pass)
#   frontend ─┘

name: CI

on:
  push:
    branches: [main]
  pull_request:

# If you push twice quickly, cancel the older run instead of wasting minutes on it
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4                 # download the repo onto the runner
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff==0.7.3
      - run: ruff check .

  ml:
    name: ML tests + model quality gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip                              # reuse downloaded packages between runs
          cache-dependency-path: ml/requirements-dev.txt
      - run: pip install -r ml/requirements-dev.txt kaggle==1.6.17

      # The dataset isn't in git, so CI downloads it with YOUR Kaggle API key,
      # stored as encrypted repository secrets (never visible in logs).
      - name: Download dataset from Kaggle
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: kaggle datasets download -d shivamb/real-or-fake-fake-jobposting-prediction -p data/raw --unzip

      # Retrain from scratch: proves the model is reproducible from code + data,
      # and gives the quality gate fresh numbers (not the ones committed to git).
      - name: Train model
        run: python ml/train.py

      - name: Run ML tests (rules, scoring, ml-service API, quality gate)
        run: python -m pytest ml/tests -v

      - name: Save metrics as a downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: model-metrics
          path: ml/models/*.metrics.json

  api:
    name: API integration tests
    runs-on: ubuntu-latest

    # A real PostgreSQL next to the job, just like docker run, but managed by GitHub
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: fakehire
          POSTGRES_PASSWORD: ci-password          # throwaway DB that only exists during this job
          POSTGRES_DB: fakehire_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fakehire"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://fakehire:ci-password@localhost:5432/fakehire_test
      TEST_DATABASE_URL: postgresql+psycopg://fakehire:ci-password@localhost:5432/fakehire_test
      JWT_SECRET: ci-only-test-secret-not-used-anywhere-real-0123456789

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: api/requirements-dev.txt
      - run: pip install -r api/requirements-dev.txt

      - name: Apply database migrations
        run: python db/migrate.py              # same runner you use locally

      - name: Run API tests
        run: python -m pytest api/tests -v

  frontend:
    name: Frontend type-check + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build                        # tsc fails the job on any type error
        working-directory: frontend

  docker:
    name: Docker images build
    needs: [lint, ml, api, frontend]              # only build if everything above passed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t fakehire-api:ci api
      - run: docker build -t fakehire-ml:ci ml
      - run: docker build -f nginx/Dockerfile -t fakehire-nginx:ci .
