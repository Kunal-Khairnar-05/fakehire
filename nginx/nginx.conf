# Nginx: the single front door. Only this container is reachable from your laptop (port 80).
# Everything else (api, ml, redis, postgres) is only reachable inside the Docker network.

events {}

http {
    # Log which API copy served each request and how long it took
    log_format main '$remote_addr "$request" $status upstream=$upstream_addr '
                    'request_time=${request_time}s upstream_time=${upstream_response_time}s';
    access_log /dev/stdout main;
    error_log  /dev/stderr warn;

    # ---- Per-IP rate limit: a second line of defence in front of the API ----
    # The API limits per USER (needs a valid token). This limits per IP address,
    # so even unauthenticated floods (e.g. login spam) are cut off before reaching Python.
    # 10m = 10 MB of memory to remember ~160,000 IP addresses.
    limit_req_zone $binary_remote_addr zone=per_ip:10m rate=20r/s;
    limit_req_status 429;

    # ---- The load balancer ----
    # "api" is the Compose service name. Docker's DNS answers it with the IPs of ALL
    # 3 replicas, and Nginx spreads requests across them in turn (round robin).
    # max_fails/fail_timeout = passive health check: after 3 failed requests, Nginx
    # stops sending traffic to that copy for 10 s, then tries it again.
    upstream api_servers {
        server api:8000 max_fails=3 fail_timeout=10s;
        keepalive 16;   # reuse connections to the API instead of opening one per request
    }

    server {
        listen 80;

        client_max_body_size 64k;   # a job posting is a few KB; reject huge bodies early

        location / {
            limit_req zone=per_ip burst=40 nodelay;   # allow short bursts up to 40

            proxy_pass http://api_servers;
            proxy_http_version 1.1;
            proxy_set_header Connection "";           # needed for keepalive

            # Tell the API who the real client is (otherwise it only ever sees Nginx's IP)
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 2s;
            proxy_read_timeout    10s;

            # If a copy is down, retry the request on another copy.
            # Nginx does NOT retry POSTs by default (a POST might have half-run already),
            # so only safe requests like GET get retried. That's the correct default.
            proxy_next_upstream error timeout http_502 http_503;

            # Visible in Swagger/curl: which copy answered (IP:port)
            add_header X-Upstream $upstream_addr always;
        }
    }
}
